services:
  - type: web
    name: dhanush-portfolio-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: FRONTEND_ORIGIN
        value: "https://dhanush-portfolio.vercel.app,http://localhost:5500,http://127.0.0.1:5500"
      - key: MAIL_RECIPIENT
        value: dr114547@gmail.com
      - key: DEV_MODE
        value: "true"
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
